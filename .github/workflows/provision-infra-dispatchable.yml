name: Provision AWS Infrastructure (dispatchable)

on:
  workflow_dispatch:
    inputs:
      stackName:
        description: 'CDK stack name'
        required: false
        default: 'RuthyPearlsEbStack'
  repository_dispatch:
    types: [provision_infra]

jobs:
  deploy:
    name: Deploy CDK stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK dependencies
        working-directory: cdk
        run: npm ci

      - name: CDK Bootstrap
        working-directory: cdk
        run: npx cdk bootstrap --require-approval never
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: CDK Deploy
        working-directory: cdk
        run: npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Upload CDK outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: cdk/cdk-outputs.json
