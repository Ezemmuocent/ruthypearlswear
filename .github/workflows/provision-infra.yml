name: Provision AWS Infrastructure (CDK)

on:
  workflow_dispatch:
    inputs:
      stackName:
        description: 'CDK stack name'
        required: true
        default: 'RuthyPearlsEbStack'

permissions:
  id-token: write
  contents: read

jobs:
  cdk-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::920263653057:role/GitHubActionsRuthyPearlsRole
          aws-region: us-east-1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CDK dependencies
        run: |
          cd cdk
          npm ci

      - name: Bootstrap CDK (if needed)
        run: |
          cd cdk
          npx cdk bootstrap || true

      - name: Deploy CDK stack
        run: |
          cd cdk
          npx cdk deploy --require-approval never
